services:
  server:
    image: minecraft-server:dev
    container_name: minecraft-server-dev
    ports: !override
      - "19134:19132/udp"
      - "19135:19133/udp"
  webui:
    image: minecraft-webui:dev
    container_name: minecraft-webui-dev
    ports: !override
      - "8081:8080"
    environment: !override
      - CONTAINER_NAME=minecraft-server-dev
      - npm_config_cache=/tmp/.npm
    command: npx nodemon index.js
    develop:
      watch:
        - action: sync
          path: ./web/backend
          target: /app/web
          ignore:
            - node_modules/
        - action: rebuild
          path: ./web/package.json
