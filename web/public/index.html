<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keystone Control</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="logo.png">
  </head>
  <body>
    <div class="container">
      <header>
        <h1 style="text-align: center;">Pretent this is something cool</h1>
        <div id="status-banner" class="hidden"></div>
      </header>

      <section class="panel">
        <h2>Create Backup</h2>
        <div class="input-group">
          <input type="text" id="backup-name" placeholder="Custom name (optional)" autocomplete="off">
          <button id="btn-create" class="btn-primary">Execute Backup</button>
        </div>
      </section>

      <section class="panel">
        <h2>Available Archives</h2>
        <div class="table-container">
          <table id="backup-table">
            <thead>
              <tr>
                <th>Filename</th>
                <th>Size</th>
                <th>Created</th>
                <th>Actions</th>
              </tr>
            </thead>

            <!-- Your container where backups are injected -->
            <tbody id="backup-list">
              <!-- Populated by app.js -->
            </tbody>
          </table>
        </div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
